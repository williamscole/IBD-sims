experiment_directory: main_experiment

postprocess: [ibdne, hapne_ibd, ibd_summary]

ibdne:
  path: ibd_sims/post_modules.py
  object: PostProcessIBDNe
  mincm: 2
  trimcm: 0.2
  gmin: 1
  gmax: 300
  nboots: 80
  nits: 1000
  npairs: 0
  workers: 16
  mem_gb: 8
  time_min: 240

  combo_args:
    filtersamples: [true, false]
    filter: [random, related, unrelated]

hapne_ibd:
  path: ibd_sims/post_modules.py
  object: PostProcessHapNeIBD
  workers: 4
  mem_gb: 16
  time_min: 120

  combo_args:
    filter: [random, related, unrelated]

ibd_summary:
  path: ibd_sims/post_modules.py
  object: PostProcessIBDSummary
  mem_gb: 1
  time_min: 10
  workers: 1
  filters: [random, related, unrelated]
