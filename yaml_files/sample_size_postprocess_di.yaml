experiment_directory: sample_size_experiment

postprocess: [ibdne, hapne_ibd, ibd_summary]

# subsample_frac=1.0 means all 1000 samples are used for random filtering.
# NOTE: after symlinking iter* files from the source experiment, delete any
# iter*_random.txt files in this experiment's directories so that get_nodes
# recomputes fresh at frac=1 rather than loading the cached 250-sample sets.
subsample_frac: 1.0

ibdne:
  path: ibd_sims/post_modules.py
  object: PostProcessIBDNe
  mincm: 2
  trimcm: 0.2
  gmin: 1
  gmax: 300
  nboots: 80
  nits: 1000
  npairs: 0
  workers: 16
  mem_gb: 8
  time_min: 240

  combo_args:
    filtersamples: [false]
    filter: [random]

hapne_ibd:
  path: ibd_sims/post_modules.py
  object: PostProcessHapNeIBD
  workers: 4
  mem_gb: 16
  time_min: 120

  combo_args:
    filter: [random]

ibd_summary:
  path: ibd_sims/post_modules.py
  object: PostProcessIBDSummary
  mem_gb: 1
  time_min: 10
  workers: 1
  filters: [random]
