experiment: main_experiment

# These HAVE to be shared across simulations
iter: 50
samples: 1000
sim_workers: 30

# These can change across simulations
gb: 8
sim_min: 30
nthreads: 8
keep_all_files: true

# Experiments
end_chr:
  30: {}

demographies:
  constant_Ne_10k:
    object: constant_Ne
    path: ibd_sims/demography.py

  constant_Ne_100k:
    object: constant_Ne100k
    path: ibd_sims/demography.py
    resources:
      sim_min: 120  # ~4x base; larger Ne means longer coalescent times

  OOA2:
    object: ooa2
    path: ibd_sims/demography.py
    resources:
      sim_min: 120
      gb: 16

custom_sims:
  quebec:
    object: load_random_50000
    path: ibd_sims/load_quebec.py
    resources:
      gb: 32
      sim_min: 30
      end_chr: 22  # limited by available pre-computed tree files (chr1-22 only)

mating:
  DTWF_mono:
    pedigree_mode: true
    mating: mono
    gen_end: 25
    pedigree_file: null

post_processing: none
